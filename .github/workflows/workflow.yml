name: Main workflow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
      - main
  schedule:
    - cron: 0 0 * * 5

env:
  # Build dependencies from the README. Optional GMP and sodium are not tested here.
  UBUNTU_DEPS: "autoconf bison build-essential curl git python3 pkg-config re2c ca-certificates libbz2-dev libcurl4-openssl-dev libicu-dev libjpeg-dev libpng-dev libonig-dev libreadline-dev libsqlite3-dev libssl-dev libxml2-dev libzip-dev zlib1g-dev libxslt1-dev libtidy-dev"
  MACOS_DEPS: "autoconf bison bzip2 icu4c libedit libiconv libjpeg libpng libxml2 libxslt libzip openssl@3 pkg-config re2c zlib python3"

jobs:
  plugin_test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu is pinned to 24.04: ubuntu-latest is 26.04, which has no gcc-9
          # package (used for the legacy builds) and no setup-python Python 3.9.
          - os: ubuntu-24.04
            version: 8.3.36
            is_legacy: true
          - os: ubuntu-24.04
            version: 8.4.27
            is_legacy: true
          - os: ubuntu-24.04
            version: 8.5.12
            is_legacy: true
          # MacOS
          - os: macos-latest
            version: 8.3.36
            is_legacy: true
          - os: macos-latest
            version: 8.4.27
            is_legacy: true
          - os: macos-latest
            version: 8.5.12
            is_legacy: true
          # Latest
          - os: ubuntu-24.04
            version: latest
            is_legacy: false
          - os: macos-latest
            version: latest
            is_legacy: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize submodule and set permissions
        run: |
          git submodule update --init --recursive
          chmod +x bin/* lib/*

      - name: Install system packages
        run: |
          set -e
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ env.UBUNTU_DEPS }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install ${{ env.MACOS_DEPS }}
            # Exercise the documented optional tidy extension in CI.
            brew install tidy-html5
            # Set up macOS-specific environment for PHP build
            echo "CXXFLAGS=-std=c++17 -stdlib=libc++" >> $GITHUB_ENV
            # Set up library paths for configure to find dependencies
            echo "LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV
            echo "CPPFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
            # Set ICU4C prefix once for reuse
            if brew --prefix icu4c@78 >/dev/null 2>&1; then
              ICU_PREFIX="$(brew --prefix icu4c@78)"
            else
              ICU_PREFIX="$(brew --prefix icu4c)"
            fi
            echo "ICU_PREFIX=$ICU_PREFIX" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH=$ICU_PREFIX/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

            # Configure tidy once for reuse
            TIDY_PREFIX="$(brew --prefix tidy-html5)"
            if [ -f "$TIDY_PREFIX/lib/libtidy.dylib" ] || [ -f "$TIDY_PREFIX/lib/libtidy.a" ]; then
              echo "✓ tidy library found, enabling tidy support"
              echo "TIDY_CONFIG=--with-tidy=$TIDY_PREFIX" >> $GITHUB_ENV
            else
              echo "⚠ tidy library not found, disabling tidy support"
              echo "TIDY_CONFIG=--without-tidy" >> $GITHUB_ENV
            fi
          fi

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v4

      - name: Configure environment for PHP ${{ matrix.version }}
        run: |
          # Add plugin from current checkout
          asdf plugin add php $GITHUB_WORKSPACE

          # Set common environment
          export PHP_BUILD_XDEBUG_ENABLE=off
          echo "PHP_BUILD_XDEBUG_ENABLE=off" >> $GITHUB_ENV

          if [ "${{ matrix.is_legacy }}" = "true" ]; then
            echo "=== Configuring for legacy PHP ${{ matrix.version }} ==="

            # Use gcc-9 for legacy versions, fallback to gcc
            if command -v gcc-9 >/dev/null 2>&1; then
              COMPILER="gcc-9"
              CXXCOMPILER="g++-9"
            else
              COMPILER="gcc"
              CXXCOMPILER="g++"
            fi

            # Set legacy-specific environment
            echo "ASDF_PHP_OPENSSL_AUTO=yes" >> $GITHUB_ENV
            echo "CC=$COMPILER" >> $GITHUB_ENV
            echo "CXX=$CXXCOMPILER" >> $GITHUB_ENV
            echo "ac_cv_prog_CC=$COMPILER" >> $GITHUB_ENV
            echo "ac_cv_prog_CXX=$CXXCOMPILER" >> $GITHUB_ENV
            echo "CONFIG_SHELL=/bin/bash" >> $GITHUB_ENV

            # Add macOS-specific PHP build configure options
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "PHP_BUILD_CONFIGURE_OPTS=--with-bz2=$(brew --prefix bzip2) --with-iconv=$(brew --prefix libiconv) --with-openssl=$(brew --prefix openssl@3) ${{ env.TIDY_CONFIG }}" >> $GITHUB_ENV
            fi

            # Debug output
            echo "Compiler: $COMPILER ($($COMPILER --version | head -1))"
            echo 'int main() { return 0; }' > /tmp/test.c
            $COMPILER -o /tmp/test /tmp/test.c && echo "✓ Compiler works" || echo "✗ Compiler failed"
            rm -f /tmp/test /tmp/test.c
          else
            echo "=== Configuring for modern PHP ${{ matrix.version }} ==="
            echo "ASDF_PHP_OPENSSL_AUTO=no" >> $GITHUB_ENV
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV

            # Add macOS-specific PHP build configure options for modern versions
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "PHP_BUILD_CONFIGURE_OPTS=--with-bz2=$(brew --prefix bzip2) --with-iconv=$(brew --prefix libiconv) --with-openssl=$(brew --prefix openssl@3) ${{ env.TIDY_CONFIG }}" >> $GITHUB_ENV
            fi
          fi

      - name: Install PHP ${{ matrix.version }}
        run: |
          echo "Installing PHP ${{ matrix.version }}..."

          if ! asdf install php ${{ matrix.version }}; then
            if [ "${{ matrix.is_legacy }}" = "true" ]; then
              echo "=== Build failed - gathering diagnostics ==="
              echo "Environment: CC=$CC, ac_cv_prog_CC=$ac_cv_prog_CC"
              # On macOS, php-build writes its log to $TMPDIR (/var/folders/…), not /tmp
              # Search both locations so diagnostics work on macOS and Linux
              SEARCH_DIRS="${TMPDIR:-} /tmp /var/folders"
              for _sdir in $SEARCH_DIRS; do
                [ -d "$_sdir" ] || continue
                find "$_sdir" -maxdepth 6 -name "php-build.${{ matrix.version }}.*.log" 2>/dev/null | while read -r _log; do
                  echo "=== $( basename \"$_log\" ) ==="
                  tail -150 "$_log"
                done
              done
              find /var/tmp -maxdepth 6 -name "config.log" -path "*/${{ matrix.version }}/*" 2>/dev/null -exec tail -50 {} \; || true
            fi
            exit 1
          fi

      - name: Test PHP installation
        run: |
          asdf set php ${{ matrix.version }}
          php --version
          echo "Installation path: $(asdf where php)"

          # php --ri exits non-zero when an extension is not loaded
          for ext in openssl curl intl mbstring zip gd xsl bz2 pdo_sqlite tidy; do
            php --ri "$ext" >/dev/null || { echo "✗ $ext extension missing"; exit 1; }
            echo "✓ $ext"
          done

          # Test Composer if available
          if command -v composer >/dev/null 2>&1; then
            echo "Composer: $(composer --version)"
          else
            echo "Composer not available"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl make xz-utils
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" -o shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Run lint
        run: make lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64" -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check format
        run: make fmt-check

  unit:
    # setup-python has no Python 3.9 build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run tests and installer line-count gate
        run: make test linecount-check

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed bash curl git nodejs autoconf bison gcc make re2c pkgconf python ca-certificates libxml2 sqlite oniguruma libzip libjpeg-turbo libpng icu openssl readline zlib bzip2 libxslt tidy
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup asdf
        uses: asdf-vm/actions/setup@v4
      - name: Build and check PHP latest
        shell: bash
        run: |
          set -euo pipefail
          asdf plugin add php "$GITHUB_WORKSPACE"
          if ! asdf install php latest; then
            find "${TMPDIR:-/tmp}" /tmp -name 'php-build.*.log' -type f -print -exec tail -150 {} \; 2>/dev/null || true
            exit 1
          fi
          asdf set php latest
          php --version
          for ext in openssl curl intl mbstring zip gd xsl bz2 pdo_sqlite tidy; do
            php --ri "$ext" >/dev/null
            printf '✓ %s\n' "$ext"
          done

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install system packages
        run: dnf install -y bash curl git nodejs autoconf bison gcc gcc-c++ make re2c pkgconf-pkg-config python3 ca-certificates libxml2-devel sqlite-devel oniguruma-devel libcurl-devel libzip-devel libjpeg-turbo-devel libpng-devel libicu-devel openssl-devel readline-devel zlib-devel bzip2-devel libxslt-devel libtidy-devel
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup asdf
        uses: asdf-vm/actions/setup@v4
      - name: Build and check PHP latest
        shell: bash
        run: |
          set -euo pipefail
          asdf plugin add php "$GITHUB_WORKSPACE"
          if ! asdf install php latest; then
            find "${TMPDIR:-/tmp}" /tmp -name 'php-build.*.log' -type f -print -exec tail -150 {} \; 2>/dev/null || true
            exit 1
          fi
          asdf set php latest
          php --version
          for ext in openssl curl intl mbstring zip gd xsl bz2 pdo_sqlite tidy; do
            php --ri "$ext" >/dev/null
            printf '✓ %s\n' "$ext"
          done
